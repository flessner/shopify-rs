[package]
name = "shopify_storefront"
version = "0.1.1"
edition = "2024"
authors = ["Torben A. Flessner <git@flessner.dev>"]
description = "Client for the Shopify Storefront API (2026-01)"
repository = "https://github.com/flessner/shopify-rs"
license = "MIT OR Apache-2.0"

[dependencies]
cynic = { version = "3", features = ["http-reqwest"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_family = "wasm")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[build-dependencies]
cynic-codegen = "3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
